<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="ScanRelay repository card">
  <defs>
    <linearGradient id="sr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08001f"/>
      <stop offset="0.62" stop-color="#150034"/>
      <stop offset="1" stop-color="#22003e"/>
    </linearGradient>
    <linearGradient id="sr-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffe7"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ff00d9"/>
    </linearGradient>
    <pattern id="sr-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7c3aed" stroke-width="0.6" opacity="0.2"/>
    </pattern>
    <filter id="sr-glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="576" height="246" rx="14" fill="url(#sr-bg)" stroke="url(#sr-border)" stroke-width="3"/>
  <rect x="3" y="3" width="574" height="244" rx="13" fill="url(#sr-grid)"/>
  <path d="M22 22h55M22 22v34M558 22h-55M558 22v34M22 228h55M22 228v-34M558 228h-55M558 228v-34" fill="none" stroke="#00ffe7" stroke-width="2" opacity="0.85"/>

  <g font-family="'JetBrains Mono', Consolas, monospace">
    <text x="38" y="42" fill="#ff00d9" font-size="10" letter-spacing="3">ACTIVE TRANSMISSION // 01</text>
    <circle cx="534" cy="37" r="5" fill="#00ffe7" filter="url(#sr-glow)">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="91" fill="#00ffe7" font-size="32" font-weight="800" letter-spacing="2" filter="url(#sr-glow)">SCANRELAY</text>
    <text x="38" y="123" fill="#fff8e7" font-size="14">Security findings in.</text>
    <text x="38" y="146" fill="#c4b5fd" font-size="14">Auditable remediation out.</text>

    <g transform="translate(38,170)" font-size="10" font-weight="700" letter-spacing="1.5">
      <rect width="88" height="28" rx="4" fill="#00ffe7" opacity="0.13" stroke="#00ffe7"/>
      <text x="44" y="18" text-anchor="middle" fill="#00ffe7">PYTHON</text>
      <g transform="translate(100,0)">
        <rect width="104" height="28" rx="4" fill="#ff00d9" opacity="0.13" stroke="#ff00d9"/>
        <text x="52" y="18" text-anchor="middle" fill="#ff00d9">SECURITY</text>
      </g>
      <g transform="translate(216,0)">
        <rect width="132" height="28" rx="4" fill="#7c3aed" opacity="0.2" stroke="#c4b5fd"/>
        <text x="66" y="18" text-anchor="middle" fill="#c4b5fd">MULTI-AGENT</text>
      </g>
    </g>

    <text x="38" y="224" fill="#8b7fb8" font-size="9" letter-spacing="2">SNYK · QUALYS · SONARQUBE · SARIF</text>
    <text x="542" y="224" text-anchor="end" fill="#00ffe7" font-size="9" letter-spacing="2">PIPELINE // READY</text>
  </g>

  <path d="M430 60l40 23v46l-40 23-40-23V83z" fill="none" stroke="#ff00d9" stroke-width="1.5" opacity="0.35"/>
  <path d="M430 74l28 16v32l-28 16-28-16V90z" fill="none" stroke="#00ffe7" stroke-width="1.5" opacity="0.55"/>
  <path d="M416 106l10 10 20-24" fill="none" stroke="#fff8e7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#sr-glow)"/>
</svg>
