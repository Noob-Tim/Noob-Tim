<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Technology loadout">
  <defs>
    <linearGradient id="tl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08001f"/>
      <stop offset="0.5" stop-color="#160035"/>
      <stop offset="1" stop-color="#08001f"/>
    </linearGradient>
    <linearGradient id="tl-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff00d9"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#00ffe7"/>
    </linearGradient>
    <pattern id="tl-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7c3aed" stroke-width="0.6" opacity="0.18"/>
    </pattern>
    <filter id="tl-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="1196" height="186" rx="14" fill="url(#tl-bg)" stroke="url(#tl-line)" stroke-width="2"/>
  <rect x="3" y="3" width="1194" height="184" rx="13" fill="url(#tl-grid)"/>
  <line x1="64" y1="102" x2="1136" y2="102" stroke="url(#tl-line)" stroke-width="2" opacity="0.48"/>

  <g font-family="'JetBrains Mono', Consolas, monospace" text-anchor="middle">
    <text x="70" y="29" text-anchor="start" fill="#8b7fb8" font-size="9" letter-spacing="3">LOADOUT BUS // TEN MODULES CONNECTED</text>
    <text x="1130" y="29" text-anchor="end" fill="#00ffe7" font-size="9" letter-spacing="3">COMPATIBILITY // NOMINAL</text>

    <g transform="translate(72,48)">
      <rect width="92" height="104" rx="12" fill="#070b22" stroke="#3776ab" stroke-width="2"/>
      <circle cx="46" cy="54" r="28" fill="#3776ab" opacity="0.14"/>
      <text x="46" y="63" fill="#ffd43b" font-size="25" font-weight="800" filter="url(#tl-glow)">PY</text>
      <text x="46" y="92" fill="#c4b5fd" font-size="9" letter-spacing="1">PYTHON</text>
    </g>
    <g transform="translate(180,48)">
      <rect width="92" height="104" rx="12" fill="#070b22" stroke="#3178c6" stroke-width="2"/>
      <circle cx="46" cy="54" r="28" fill="#3178c6" opacity="0.16"/>
      <text x="46" y="63" fill="#38bdf8" font-size="25" font-weight="800" filter="url(#tl-glow)">TS</text>
      <text x="46" y="92" fill="#c4b5fd" font-size="9" letter-spacing="1">TYPESCRIPT</text>
    </g>
    <g transform="translate(288,48)">
      <rect width="92" height="104" rx="12" fill="#070b22" stroke="#f7df1e" stroke-width="2"/>
      <circle cx="46" cy="54" r="28" fill="#f7df1e" opacity="0.13"/>
      <text x="46" y="63" fill="#f7df1e" font-size="25" font-weight="800" filter="url(#tl-glow)">JS</text>
      <text x="46" y="92" fill="#c4b5fd" font-size="9" letter-spacing="1">JAVASCRIPT</text>
    </g>
    <g transform="translate(396,48)">
      <rect width="92" height="104" rx="12" fill="#070b22" stroke="#00add8" stroke-width="2"/>
      <circle cx="46" cy="54" r="28" fill="#00add8" opacity="0.15"/>
      <text x="46" y="63" fill="#00ffe7" font-size="25" font-weight="800" filter="url(#tl-glow)">GO</text>
      <text x="46" y="92" fill="#c4b5fd" font-size="9" letter-spacing="1">GOLANG</text>
    </g>
    <g transform="translate(504,48)">
      <rect width="92" height="104" rx="12" fill="#070b22" stroke="#ff5a36" stroke-width="2"/>
      <circle cx="46" cy="54" r="28" fill="#ff5a36" opacity="0.13"/>
      <text x="46" y="63" fill="#ff7b5c" font-size="25" font-weight="800" filter="url(#tl-glow)">RS</text>
      <text x="46" y="92" fill="#c4b5fd" font-size="9" letter-spacing="1">RUST</text>
    </g>
    <g transform="translate(612,48)">
      <rect width="92" height="104" rx="12" fill="#070b22" stroke="#2496ed" stroke-width="2"/>
      <circle cx="46" cy="54" r="28" fill="#2496ed" opacity="0.15"/>
      <text x="46" y="63" fill="#38bdf8" font-size="25" font-weight="800" filter="url(#tl-glow)">DK</text>
      <text x="46" y="92" fill="#c4b5fd" font-size="9" letter-spacing="1">DOCKER</text>
    </g>
    <g transform="translate(720,48)">
      <rect width="92" height="104" rx="12" fill="#070b22" stroke="#f05032" stroke-width="2"/>
      <circle cx="46" cy="54" r="28" fill="#f05032" opacity="0.13"/>
      <text x="46" y="63" fill="#ff795c" font-size="25" font-weight="800" filter="url(#tl-glow)">GT</text>
      <text x="46" y="92" fill="#c4b5fd" font-size="9" letter-spacing="1">GIT</text>
    </g>
    <g transform="translate(828,48)">
      <rect width="92" height="104" rx="12" fill="#070b22" stroke="#ff00d9" stroke-width="2"/>
      <circle cx="46" cy="54" r="28" fill="#ff00d9" opacity="0.13"/>
      <text x="46" y="63" fill="#ff5be5" font-size="23" font-weight="800" filter="url(#tl-glow)">GHA</text>
      <text x="46" y="92" fill="#c4b5fd" font-size="9" letter-spacing="1">ACTIONS</text>
    </g>
    <g transform="translate(936,48)">
      <rect width="92" height="104" rx="12" fill="#070b22" stroke="#fff8e7" stroke-width="2"/>
      <circle cx="46" cy="54" r="28" fill="#fff8e7" opacity="0.1"/>
      <text x="46" y="63" fill="#fff8e7" font-size="25" font-weight="800" filter="url(#tl-glow)">LX</text>
      <text x="46" y="92" fill="#c4b5fd" font-size="9" letter-spacing="1">LINUX</text>
    </g>
    <g transform="translate(1044,48)">
      <rect width="92" height="104" rx="12" fill="#070b22" stroke="#007acc" stroke-width="2"/>
      <circle cx="46" cy="54" r="28" fill="#007acc" opacity="0.15"/>
      <text x="46" y="63" fill="#00ffe7" font-size="22" font-weight="800" filter="url(#tl-glow)">VSC</text>
      <text x="46" y="92" fill="#c4b5fd" font-size="9" letter-spacing="1">EDITOR</text>
    </g>
  </g>

  <g fill="#00ffe7" filter="url(#tl-glow)">
    <circle cx="64" cy="102" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1136" cy="102" r="3"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
