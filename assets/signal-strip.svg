<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 108" width="1200" height="108" role="img" aria-label="Noob-Tim profile signal status">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08001f"/>
      <stop offset="0.5" stop-color="#14002f"/>
      <stop offset="1" stop-color="#08001f"/>
    </linearGradient>
    <linearGradient id="ss-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff00d9"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#00ffe7"/>
    </linearGradient>
    <pattern id="ss-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7c3aed" stroke-width="0.6" opacity="0.22"/>
    </pattern>
    <filter id="ss-glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="106" rx="12" fill="url(#ss-bg)" stroke="url(#ss-line)" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="104" rx="11" fill="url(#ss-grid)"/>
  <path d="M18 18h32M18 18v22M1182 18h-32M1182 18v22M18 90h32M18 90V68M1182 90h-32M1182 90V68" fill="none" stroke="#00ffe7" stroke-width="2" filter="url(#ss-glow)"/>

  <g font-family="'JetBrains Mono', Consolas, monospace">
    <g transform="translate(70,31)">
      <text fill="#8b7fb8" font-size="10" letter-spacing="2">NODE</text>
      <text y="32" fill="#fff8e7" font-size="18" font-weight="700" letter-spacing="2">NOOB-TIM</text>
    </g>
    <g transform="translate(330,31)">
      <text fill="#8b7fb8" font-size="10" letter-spacing="2">PUBLIC REPOS</text>
      <text y="32" fill="#00ffe7" font-size="18" font-weight="700" letter-spacing="2" filter="url(#ss-glow)">28</text>
    </g>
    <g transform="translate(560,31)">
      <text fill="#8b7fb8" font-size="10" letter-spacing="2">FOLLOWERS</text>
      <text y="32" fill="#ff00d9" font-size="18" font-weight="700" letter-spacing="2" filter="url(#ss-glow)">01</text>
    </g>
    <g transform="translate(790,31)">
      <text fill="#8b7fb8" font-size="10" letter-spacing="2">BUILD MODE</text>
      <text y="32" fill="#fff8e7" font-size="18" font-weight="700" letter-spacing="2">PUBLIC</text>
    </g>
    <g transform="translate(1030,31)">
      <text fill="#8b7fb8" font-size="10" letter-spacing="2">SYSTEM</text>
      <circle cx="6" cy="31" r="5" fill="#00ffe7" filter="url(#ss-glow)">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="37" fill="#00ffe7" font-size="18" font-weight="700" letter-spacing="2">ONLINE</text>
    </g>
  </g>

  <rect x="0" y="101" width="1200" height="2" fill="url(#ss-line)" opacity="0.85">
    <animate attributeName="x" values="-1200;1200" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
