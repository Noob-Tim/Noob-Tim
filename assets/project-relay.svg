<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="relay repository card">
  <defs>
    <linearGradient id="ry-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08001f"/>
      <stop offset="0.55" stop-color="#130032"/>
      <stop offset="1" stop-color="#002c37"/>
    </linearGradient>
    <linearGradient id="ry-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff00d9"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#00ffe7"/>
    </linearGradient>
    <pattern id="ry-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ffe7" stroke-width="0.6" opacity="0.16"/>
    </pattern>
    <filter id="ry-glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="576" height="246" rx="14" fill="url(#ry-bg)" stroke="url(#ry-border)" stroke-width="3"/>
  <rect x="3" y="3" width="574" height="244" rx="13" fill="url(#ry-grid)"/>
  <path d="M22 22h55M22 22v34M558 22h-55M558 22v34M22 228h55M22 228v-34M558 228h-55M558 228v-34" fill="none" stroke="#ff00d9" stroke-width="2" opacity="0.85"/>

  <g font-family="'JetBrains Mono', Consolas, monospace">
    <text x="38" y="42" fill="#00ffe7" font-size="10" letter-spacing="3">ACTIVE TRANSMISSION // 02</text>
    <circle cx="534" cy="37" r="5" fill="#ff00d9" filter="url(#ry-glow)">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="91" fill="#ff00d9" font-size="32" font-weight="800" letter-spacing="5" filter="url(#ry-glow)">RELAY</text>
    <text x="38" y="123" fill="#fff8e7" font-size="14">Repository-native AI workflows.</text>
    <text x="38" y="146" fill="#c4b5fd" font-size="14">File-first handoffs. Gates. Validators.</text>

    <g transform="translate(38,170)" font-size="10" font-weight="700" letter-spacing="1.5">
      <rect width="88" height="28" rx="4" fill="#00ffe7" opacity="0.13" stroke="#00ffe7"/>
      <text x="44" y="18" text-anchor="middle" fill="#00ffe7">PYTHON</text>
      <g transform="translate(100,0)">
        <rect width="76" height="28" rx="4" fill="#ff00d9" opacity="0.13" stroke="#ff00d9"/>
        <text x="38" y="18" text-anchor="middle" fill="#ff00d9">YAML</text>
      </g>
      <g transform="translate(188,0)">
        <rect width="92" height="28" rx="4" fill="#7c3aed" opacity="0.2" stroke="#c4b5fd"/>
        <text x="46" y="18" text-anchor="middle" fill="#c4b5fd">AGENTS</text>
      </g>
    </g>

    <text x="38" y="224" fill="#8b7fb8" font-size="9" letter-spacing="2">WORKFLOWS · HANDOFFS · GATES · VALIDATORS</text>
    <text x="542" y="224" text-anchor="end" fill="#ff00d9" font-size="9" letter-spacing="2">STAR // 01</text>
  </g>

  <g transform="translate(423,102)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-34" cy="-28" r="11" stroke="#00ffe7" stroke-width="3" filter="url(#ry-glow)"/>
    <circle cx="34" cy="-28" r="11" stroke="#ff00d9" stroke-width="3" filter="url(#ry-glow)"/>
    <circle cx="0" cy="34" r="11" stroke="#fff8e7" stroke-width="3" filter="url(#ry-glow)"/>
    <path d="M-23-28h46M-28-18l21 42M28-18L7 24" stroke="#7c3aed" stroke-width="2.5"/>
    <path d="M-3-4l8 8-8 8" stroke="#00ffe7" stroke-width="3" filter="url(#ry-glow)"/>
  </g>
</svg>
